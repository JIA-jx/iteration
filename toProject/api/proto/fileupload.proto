syntax = "proto3";

package fileupload;

option go_package = "./fileupload";

service ChunkUploadService {
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);
  rpc UploadStatus(UploadStatusRequest) returns (UploadStatusResponse);
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse);
  rpc MergeChunks(MergeChunksRequest) returns (MergeChunksResponse);
}

message InitUploadRequest {
  string upload_id = 1;
  string file_name = 2;
  int64  file_size = 3;
  int32  total_chunks = 4;
  string file_md5 = 5;
  string content_type = 6;
}

message InitUploadResponse {
  string upload_id = 1;
  repeated int32 uploaded_chunks = 2;
  int32 total_chunks = 3;
  bool finished = 4;
  string url = 5;
  bool instant = 6;
}

message UploadStatusRequest {
  string upload_id = 1;
}

message UploadStatusResponse {
  string upload_id = 1;
  repeated int32 uploaded_chunks = 2;
  repeated int32 missing_chunks = 3;
  int32 total_chunks = 4;
  bool finished = 5;
  string url = 6;
}

message UploadChunkRequest {
  string upload_id = 1;
  string chunk_md5 = 2;
  int32  chunk_number = 3;
  bytes  file_content = 4;
}

message UploadChunkResponse {
  string upload_id = 1;
  int32  chunk_number = 2;
  int32  received_chunks = 3;
  int32  total_chunks = 4;
  bool   finished = 5;
  string url = 6;
}

message MergeChunksRequest {
  string upload_id = 1;
}

message MergeChunksResponse {
  string url = 1;
  string file_id = 2;
  int64  file_size = 3;
}
