services:
  mysql:
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-slave-updates=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-slave:
    container_name: mysql8-slave
    image: mysql:8.0.20
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 3310:3306
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: msproject
    volumes:
      - ${MYSQL_SLAVE_DIR}/data:/var/lib/mysql
      - ${MYSQL_SLAVE_DIR}/conf:/etc/mysql/conf.d/
      - ${MYSQL_SLAVE_DIR}/logs:/logs
      - ./deploy/mysql/slave-init.sh:/docker-entrypoint-initdb.d/slave-init.sh:ro
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --server-id=2
      --relay-log=relay-bin
      --read-only=ON
      --super-read-only=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
